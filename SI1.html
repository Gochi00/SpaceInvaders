```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050505;
        color: #fff;
        font-family: "Courier New", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }

    #gameWrapper {
        text-align: center;
    }

    #hud {
        width: 800px;
        max-width: 95vw;
        display: flex;
        justify-content: space-between;
        padding: 10px 5px;
        font-size: 18px;
        color: #00ff66;
    }

    canvas {
        display: block;
        background: #000;
        border: 3px solid #333;
        box-shadow: 0 0 30px rgba(0, 255, 100, 0.15);
        width: 800px;
        max-width: 95vw;
        height: auto;
        image-rendering: pixelated;
    }

    #message {
        position: absolute;
        text-align: center;
        width: 100%;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        pointer-events: none;
    }

    #message h1 {
        color: #00ff66;
        font-size: 42px;
        margin: 0 0 20px;
        text-shadow: 0 0 15px #00ff66;
    }

    #message p {
        font-size: 18px;
        color: #fff;
    }

    .hidden {
        display: none;
    }

    #controls {
        color: #888;
        font-size: 13px;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div id="gameWrapper">

    <div id="hud">
        <div>SCORE: <span id="score">0</span></div>
        <div>LEVEL: <span id="level">1</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>

    <canvas id="game" width="800" height="600"></canvas>

    <div id="controls">
        ← → Move &nbsp;&nbsp; SPACE Shoot &nbsp;&nbsp; P Pause
    </div>
</div>

<div id="message">
    <h1>SPACE INVADERS</h1>
    <p>Press SPACE to start</p>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreDisplay = document.getElementById("score");
const livesDisplay = document.getElementById("lives");
const levelDisplay = document.getElementById("level");
const message = document.getElementById("message");


// ============================================================
// GAME SETTINGS
// ============================================================

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

let gameState = "start";

let score = 0;
let lives = 3;
let level = 1;

let lastTime = 0;

let alienDirection = 1;
let alienMoveTimer = 0;
let alienMoveInterval = 600;

let alienShootTimer = 0;
let alienShootInterval = 1000;

let stars = [];


// ============================================================
// AUDIO
// ============================================================

let audioContext = null;

function initAudio() {
    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }
}

function sound(frequency, duration, type = "square") {

    if (!audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(0.08, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
}


// ============================================================
// STARS
// ============================================================

for (let i = 0; i < 120; i++) {

    stars.push({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        size: Math.random() < 0.8 ? 1 : 2,
        speed: 10 + Math.random() * 30
    });

}


// ============================================================
// PLAYER
// ============================================================

const player = {

    width: 70,
    height: 85,

    x: WIDTH / 2 - 35,
    y: HEIGHT - 105,

    speed: 400,

    cooldown: 0,
    cooldownTime: 280,

    invulnerable: 0
};


// Load Quby character
const qubyImage = new Image();
qubyImage.src = "quby_sprite.png";

// ============================================================
// BULLETS
// ============================================================

let playerBullets = [];
let alienBullets = [];


// ============================================================
// ALIENS
// ============================================================

let aliens = [];

const alienTypes = [

    {
        points: 30,
        width: 32,
        height: 22,
        symbol: [
            "00111100",
            "01111110",
            "11011011",
            "11111111",
            "00100100",
            "01011010"
        ]
    },

    {
        points: 20,
        width: 34,
        height: 22,
        symbol: [
            "00011000",
            "00111100",
            "01111110",
            "11011011",
            "11111111",
            "01000010"
        ]
    },

    {
        points: 10,
        width: 34,
        height: 22,
        symbol: [
            "00111100",
            "01111110",
            "11111111",
            "11011011",
            "00100100",
            "01000010"
        ]
    }

];


// ============================================================
// SHIELDS
// ============================================================

let shields = [];

function createShields() {

    shields = [];

    const positions = [120, 285, 450, 615];

    positions.forEach(x => {

        const blocks = [];

        for (let row = 0; row < 5; row++) {

            for (let col = 0; col < 10; col++) {

                // Create a curved shield shape
                if (
                    row < 2 ||
                    (col > 1 && col < 8) ||
                    row === 2
                ) {

                    blocks.push({
                        x: x + col * 8,
                        y: HEIGHT - 135 + row * 8,
                        alive: true
                    });

                }

            }

        }

        shields.push(blocks);

    });

}


// ============================================================
// CREATE ALIENS
// ============================================================

function createAliens() {

    aliens = [];

    const rows = 5;
    const cols = 11;

    const spacingX = 55;
    const spacingY = 42;

    const startX = 105;
    const startY = 80;

    for (let row = 0; row < rows; row++) {

        for (let col = 0; col < cols; col++) {

            let type;

            if (row === 0) {
                type = alienTypes[0];
            }
            else if (row <= 2) {
                type = alienTypes[1];
            }
            else {
                type = alienTypes[2];
            }

            aliens.push({

                x: startX + col * spacingX,
                y: startY + row * spacingY,

                width: type.width,
                height: type.height,

                points: type.points,

                symbol: type.symbol,

                alive: true

            });

        }

    }

    alienDirection = 1;
    alienMoveTimer = 0;

    alienMoveInterval = Math.max(
        100,
        600 - (level - 1) * 70
    );

}


// ============================================================
// RESET GAME
// ============================================================

function resetGame() {

    score = 0;
    lives = 3;
    level = 1;

    player.x = WIDTH / 2 - player.width / 2;
    player.invulnerable = 0;

    playerBullets = [];
    alienBullets = [];

    createAliens();
    createShields();

    updateHUD();

}


// ============================================================
// START GAME
// ============================================================

function startGame() {

    initAudio();

    resetGame();

    gameState = "playing";

    message.classList.add("hidden");

    sound(440, 0.1);
    sound(660, 0.15);

}


// ============================================================
// NEXT LEVEL
// ============================================================

function nextLevel() {

    level++;

    playerBullets = [];
    alienBullets = [];

    createAliens();
    createShields();

    player.x = WIDTH / 2 - player.width / 2;

    sound(500, 0.1);
    setTimeout(() => sound(700, 0.1), 100);
    setTimeout(() => sound(900, 0.15), 200);

    updateHUD();

}


// ============================================================
// INPUT
// ============================================================

const keys = {};

window.addEventListener("keydown", e => {

    keys[e.key] = true;

    if (
        e.key === " " ||
        e.code === "Space"
    ) {

        e.preventDefault();

        if (gameState === "start") {
            startGame();
        }

        else if (gameState === "gameover") {
            startGame();
        }

        else if (gameState === "playing") {
            shoot();
        }

    }

    if (
        e.key.toLowerCase() === "p" &&
        gameState === "playing"
    ) {

        gameState = "paused";

        message.classList.remove("hidden");

        message.innerHTML = `
            <h1>PAUSED</h1>
            <p>Press P to continue</p>
        `;

    }

    else if (
        e.key.toLowerCase() === "p" &&
        gameState === "paused"
    ) {

        gameState = "playing";

        message.classList.add("hidden");

    }

});


window.addEventListener("keyup", e => {
    keys[e.key] = false;
});


// ============================================================
// PLAYER SHOOTING
// ============================================================

function shoot() {

    if (player.cooldown > 0) return;

    playerBullets.push({

        x: player.x + player.width / 2 - 2,
        y: player.y - 10,

        width: 4,
        height: 14,

        speed: 650

    });

    player.cooldown = player.cooldownTime;

    sound(800, 0.06);

}


// ============================================================
// ALIEN SHOOTING
// ============================================================

function alienShoot() {

    const livingAliens =
        aliens.filter(a => a.alive);

    if (livingAliens.length === 0) return;

    const alien =
        livingAliens[
            Math.floor(
                Math.random() * livingAliens.length
            )
        ];

    alienBullets.push({

        x: alien.x + alien.width / 2 - 2,
        y: alien.y + alien.height,

        width: 4,
        height: 12,

        speed: 230 + level * 20

    });

}


// ============================================================
// COLLISION DETECTION
// ============================================================

function collision(a, b) {

    return (

        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y

    );

}


// ============================================================
// UPDATE PLAYER
// ============================================================

function updatePlayer(dt) {

    if (keys["ArrowLeft"] || keys["a"]) {

        player.x -= player.speed * dt;

    }

    if (keys["ArrowRight"] || keys["d"]) {

        player.x += player.speed * dt;

    }

    player.x = Math.max(
        10,
        Math.min(
            WIDTH - player.width - 10,
            player.x
        )
    );

    if (player.cooldown > 0) {

        player.cooldown -= dt * 1000;

    }

    if (player.invulnerable > 0) {

        player.invulnerable -= dt * 1000;

    }

}


// ============================================================
// UPDATE PLAYER BULLETS
// ============================================================

function updatePlayerBullets(dt) {

    for (let i = playerBullets.length - 1; i >= 0; i--) {

        const bullet = playerBullets[i];

        bullet.y -= bullet.speed * dt;

        let destroyed = false;


        // Hit alien
        for (const alien of aliens) {

            if (
                alien.alive &&
                collision(bullet, alien)
            ) {

                alien.alive = false;

                score += alien.points;

                sound(
                    200 + alien.points * 5,
                    0.08
                );

                destroyed = true;

                break;

            }

        }


        // Hit shield
        if (!destroyed) {

            for (const shield of shields) {

                for (const block of shield) {

                    if (
                        block.alive &&
                        collision(bullet, {
                            x: block.x,
                            y: block.y,
                            width: 8,
                            height: 8
                        })
                    ) {

                        block.alive = false;

                        destroyed = true;

                        break;

                    }

                }

                if (destroyed) break;

            }

        }


        if (
            destroyed ||
            bullet.y < -20
        ) {

            playerBullets.splice(i, 1);

        }

    }

}


// ============================================================
// UPDATE ALIENS
// ============================================================

function updateAliens(dt) {

    alienMoveTimer += dt * 1000;

    if (alienMoveTimer < alienMoveInterval) {
        return;
    }

    alienMoveTimer = 0;

    const livingAliens =
        aliens.filter(a => a.alive);

    if (livingAliens.length === 0) {

        nextLevel();

        return;

    }


    let hitEdge = false;

    for (const alien of livingAliens) {

        if (
            alien.x + alien.width >= WIDTH - 20 &&
            alienDirection > 0
        ) {

            hitEdge = true;

        }

        if (
            alien.x <= 20 &&
            alienDirection < 0
        ) {

            hitEdge = true;

        }

    }


    if (hitEdge) {

        alienDirection *= -1;

        for (const alien of livingAliens) {

            alien.y += 22;

        }

    }

    else {

        for (const alien of livingAliens) {

            alien.x += 15 * alienDirection;

        }

    }


    // If aliens reach player
    for (const alien of livingAliens) {

        if (
            alien.y + alien.height >=
            player.y - 10
        ) {

            gameOver();

        }

    }

}


// ============================================================
// UPDATE ALIEN BULLETS
// ============================================================

function updateAlienBullets(dt) {

    for (
        let i = alienBullets.length - 1;
        i >= 0;
        i--
    ) {

        const bullet = alienBullets[i];

        bullet.y += bullet.speed * dt;

        let destroyed = false;


        // Hit player
        if (
            player.invulnerable <= 0 &&
            collision(bullet, player)
        ) {

            alienBullets.splice(i, 1);

            loseLife();

            continue;

        }


        // Hit shield
        for (const shield of shields) {

            for (const block of shield) {

                if (
                    block.alive &&
                    collision(bullet, {
                        x: block.x,
                        y: block.y,
                        width: 8,
                        height: 8
                    })
                ) {

                    block.alive = false;

                    destroyed = true;

                    break;

                }

            }

            if (destroyed) break;

        }


        if (
            destroyed ||
            bullet.y > HEIGHT
        ) {

            alienBullets.splice(i, 1);

        }

    }

}


// ============================================================
// LOSE LIFE
// ============================================================

function loseLife() {

    lives--;

    player.invulnerable = 2000;

    player.x = WIDTH / 2 - player.width / 2;

    alienBullets = [];

    sound(120, 0.25, "sawtooth");

    updateHUD();

    if (lives <= 0) {

        gameOver();

    }

}


// ============================================================
// GAME OVER
// ============================================================

function gameOver() {

    gameState = "gameover";

    message.classList.remove("hidden");

    message.innerHTML = `
        <h1>GAME OVER</h1>
        <p>Final Score: ${score}</p>
        <p>Press SPACE to restart</p>
    `;

    sound(150, 0.3, "sawtooth");

}


// ============================================================
// UPDATE HUD
// ============================================================

function updateHUD() {

    scoreDisplay.textContent = score;
    livesDisplay.textContent = lives;
    levelDisplay.textContent = level;

}


// ============================================================
// UPDATE STARS
// ============================================================

function updateStars(dt) {

    for (const star of stars) {

        star.y += star.speed * dt;

        if (star.y > HEIGHT) {

            star.y = 0;
            star.x = Math.random() * WIDTH;

        }

    }

}


// ============================================================
// DRAW STARS
// ============================================================

function drawStars() {

    ctx.fillStyle = "#fff";

    for (const star of stars) {

        ctx.fillRect(
            Math.floor(star.x),
            Math.floor(star.y),
            star.size,
            star.size
        );

    }

}


// ============================================================
// DRAW QUBY
// ============================================================

function drawPlayer() {

    // Flash when hit
    if (
        player.invulnerable > 0 &&
        Math.floor(player.invulnerable / 100) % 2 === 0
    ) {
        return;
    }

    // Keep Quby within the game area
    const drawWidth = player.width;
    const drawHeight = player.height;

    ctx.drawImage(
        qubyImage,
        player.x,
        player.y,
        drawWidth,
        drawHeight
    );
}

// ============================================================
// DRAW PIXEL ALIEN
// ============================================================

function drawAlien(alien) {

    ctx.fillStyle = "#ff3366";

    const pixelSize = 4;

    alien.symbol.forEach(
        (row, rowIndex) => {

            [...row].forEach(
                (pixel, colIndex) => {

                    if (pixel === "1") {

                        ctx.fillRect(

                            alien.x +
                            colIndex * pixelSize,

                            alien.y +
                            rowIndex * pixelSize,

                            pixelSize,
                            pixelSize

                        );

                    }

                }
            );

        }
    );

}


// ============================================================
// DRAW BULLETS
// ============================================================

function drawBullets() {

    // Player
    ctx.fillStyle = "#00ffff";

    for (const bullet of playerBullets) {

        ctx.fillRect(
            bullet.x,
            bullet.y,
            bullet.width,
            bullet.height
        );

    }


    // Aliens
    ctx.fillStyle = "#ffff00";

    for (const bullet of alienBullets) {

        ctx.fillRect(
            bullet.x,
            bullet.y,
            bullet.width,
            bullet.height
        );

    }

}


// ============================================================
// DRAW SHIELDS
// ============================================================

function drawShields() {

    ctx.fillStyle = "#00cc88";

    for (const shield of shields) {

        for (const block of shield) {

            if (block.alive) {

                ctx.fillRect(
                    block.x,
                    block.y,
                    8,
                    8
                );

            }

        }

    }

}


// ============================================================
// DRAW GAME
// ============================================================

function draw() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawStars();

    drawShields();

    for (const alien of aliens) {

        if (alien.alive) {

            drawAlien(alien);

        }

    }

    drawPlayer();

    drawBullets();

}


// ============================================================
// GAME LOOP
// ============================================================

function update(dt) {

    updateStars(dt);

    if (gameState !== "playing") {
        return;
    }

    updatePlayer(dt);

    updatePlayerBullets(dt);

    updateAliens(dt);

    updateAlienBullets(dt);


    alienShootTimer += dt * 1000;

    if (
        alienShootTimer >=
        Math.max(
            250,
            alienShootInterval - level * 60
        )
    ) {

        alienShootTimer = 0;

        alienShoot();

    }

    updateHUD();

}


function gameLoop(timestamp) {

    const dt =
        Math.min(
            (timestamp - lastTime) / 1000,
            0.05
        );

    lastTime = timestamp;

    update(dt);

    draw();

    requestAnimationFrame(gameLoop);

}


// ============================================================
// INITIALIZE
// ============================================================

createAliens();
createShields();

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
